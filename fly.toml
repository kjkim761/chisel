# fly.toml app configuration file generated for volunteer-chisel-tunnel on 2026-11-02T12:27:48Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'volunteer-chisel-tunnel'
primary_region = 'ams'

[build]
  args = { GO_VERSION = '1.25.0' }

[env]
  PORT = '8080'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[processes]
  app = 'server --auth volunteer:securepass123 --reverse'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
